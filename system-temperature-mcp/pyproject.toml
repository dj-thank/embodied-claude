[project]
name = "system-temperature-mcp"
version = "0.1.0"
description = "MCP server for monitoring system temperature - your sense of body temperature"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
per-file-ignores = {"src/system_temperature_mcp/server.py" = ["E501"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
system-temperature-mcp = "system_temperature_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
