[project]
name = "embodied-claude-installer"
version = "0.1.0"
description = "Installer for Embodied Claude - AI with physical senses"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "pyinstaller>=6.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[project.scripts]
embodied-claude-installer = "installer.main:main"

[tool.uv]
package = true
