[project]
name = "local-inference-mcp"
version = "0.1.0"
description = "Loopback-only local LLM inference for Sanpoloid"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.scripts]
local-inference-mcp = "local_inference_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
