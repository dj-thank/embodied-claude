[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embodied-action-policy"
version = "0.1.0"
description = "Fail-closed host action policy for embodied MCP tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
embodied-action-gate = "action_policy.hook:main"

[tool.hatch.build.targets.wheel]
packages = ["src/action_policy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
